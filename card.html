<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Moses Executive Studio — Digital Card</title>
<meta name="description" content="Moses Executive Studio — private grooming in Brickell, Miami. Book, call, save contact.">
<meta name="robots" content="noindex,follow">
<link rel="canonical" href="https://www.mosesexecutivestudio.com/card.html">
<meta name="theme-color" content="#0A0A0A">
<link rel="icon" type="image/png" href="/brand/moses-monogram.png">
<meta property="og:title" content="Moses Executive Studio">
<meta property="og:description" content="Private grooming in Brickell, Miami. Book, call, save contact.">
<meta property="og:image" content="https://www.mosesexecutivestudio.com/brand/og-image.jpg">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bodoni+Moda:ital,opsz,wght@0,6..96,400;0,6..96,500;1,6..96,400&family=Instrument+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  *{margin:0;padding:0;box-sizing:border-box}
  html,body{background:#0A0A0A}
  body{min-height:100vh;color:#F4F1EB;font-family:'Instrument Sans',system-ui,sans-serif;-webkit-font-smoothing:antialiased;
    background:radial-gradient(120% 60% at 50% -8%, #1a1712 0%, #0A0A0A 55%);display:flex;justify-content:center}
  a{text-decoration:none;color:inherit}
  ::selection{background:#B5A27A;color:#0A0A0A}
  .card{width:100%;max-width:430px;padding:42px 24px 40px;display:flex;flex-direction:column;align-items:center}
  .ring{width:96px;height:96px;border-radius:999px;border:1px solid #B5A27A;display:flex;align-items:center;justify-content:center;
    background:#111;box-shadow:0 10px 34px rgba(0,0,0,.5)}
  .ring img{width:58px;height:58px;object-fit:contain;display:block}
  .eyebrow{margin-top:22px;font-size:10px;letter-spacing:.42em;text-transform:uppercase;color:#B5A27A}
  h1{margin-top:10px;font-family:'Bodoni Moda',serif;font-weight:500;font-size:34px;line-height:1.02;letter-spacing:.01em;text-align:center;color:#F4F1EB}
  .sub{margin-top:12px;font-family:'Bodoni Moda',serif;font-style:italic;font-size:16px;line-height:1.5;color:#9B9387;text-align:center;max-width:300px}
  .loc{margin-top:8px;font-size:12px;letter-spacing:.04em;color:#6d6a62;text-align:center}
  .stack{width:100%;margin-top:30px;display:flex;flex-direction:column;gap:11px}
  .btn{height:56px;border-radius:14px;display:flex;align-items:center;justify-content:center;gap:10px;font-size:13px;font-weight:600;
    letter-spacing:.14em;text-transform:uppercase;border:1px solid #2a2621;background:#141210;color:#F4F1EB;transition:.15s}
  .btn:hover{border-color:#B5A27A}
  .btn svg{width:18px;height:18px;flex:none}
  .btn.gold{background:#B5A27A;color:#0A0A0A;border-color:#B5A27A}
  .btn.gold:hover{background:#c6b48d}
  .btn.cream{background:#F4F1EB;color:#0A0A0A;border-color:#F4F1EB}
  .row{display:flex;gap:11px}
  .row .btn{flex:1;height:54px}
  .foot{margin-top:28px;text-align:center;font-size:11px;letter-spacing:.06em;color:#5b5850;line-height:1.7}
  .foot a{color:#8E7C55}
</style>
</head>
<body>
  <main class="card">
    <div class="ring"><img src="/brand/moses-monogram-gold.png" alt="Moses Executive Studio monogram" /></div>
    <p class="eyebrow">Private Studio</p>
    <h1>Moses<br>Executive Studio</h1>
    <p class="sub">Precision grooming, by appointment.</p>
    <p class="loc">Brickell · 1170 SW 2nd Ave, Miami, FL 33130</p>

    <div class="stack">
      <a class="btn gold" href="https://www.mosesexecutivestudio.com/book.html">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="4" y="5" width="16" height="16" rx="2"/><path d="M4 10h16M9 3v4M15 3v4"/></svg>
        Book an Appointment
      </a>
      <button class="btn cream" id="saveContact" type="button">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M19 8v6M22 11h-6"/></svg>
        Save Contact
      </button>

      <div class="row">
        <a class="btn" href="tel:+17604053901" aria-label="Call">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M22 16.9v3a2 2 0 0 1-2.2 2 19.8 19.8 0 0 1-8.6-3.1 19.5 19.5 0 0 1-6-6A19.8 19.8 0 0 1 2.1 4.2 2 2 0 0 1 4.1 2h3a2 2 0 0 1 2 1.7c.1.9.3 1.8.6 2.6a2 2 0 0 1-.5 2.1L8 9.6a16 16 0 0 0 6 6l1.2-1.2a2 2 0 0 1 2.1-.5c.8.3 1.7.5 2.6.6a2 2 0 0 1 1.7 2Z"/></svg>
          Call
        </a>
        <a class="btn" href="https://wa.me/17604053901?text=Hi%20Moses%2C%20I'd%20like%20to%20book%20an%20appointment." target="_blank" rel="noopener" aria-label="WhatsApp">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M21 11.5a8.4 8.4 0 0 1-12.4 7.4L3 21l2.2-5.5A8.4 8.4 0 1 1 21 11.5Z"/></svg>
          WhatsApp
        </a>
      </div>
      <div class="row">
        <a class="btn" href="mailto:info@mosesexecutivestudio.com" aria-label="Email">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="5" width="18" height="14" rx="2"/><path d="m3 7 9 6 9-6"/></svg>
          Email
        </a>
        <a class="btn" href="https://maps.google.com/?q=1170+SW+2nd+Ave+Miami+FL+33130" target="_blank" rel="noopener" aria-label="Directions">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M12 21s7-6.3 7-11a7 7 0 1 0-14 0c0 4.7 7 11 7 11Z"/><circle cx="12" cy="10" r="2.5"/></svg>
          Directions
        </a>
      </div>
      <a class="btn" href="reviews.html">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="m12 3 2.7 5.5 6 .9-4.3 4.2 1 6L12 17l-5.4 2.8 1-6L3.3 9.4l6-.9L12 3Z"/></svg>
        Reviews
      </a>
    </div>

    <p class="foot">
      <a href="https://www.mosesexecutivestudio.com/">mosesexecutivestudio.com</a><br>
      Moses Executive Studio · Miami · By appointment
    </p>
  </main>

<script>
(function(){
  var vcard = [
    "BEGIN:VCARD","VERSION:3.0",
    "N:Scott;Moses;;;",
    "FN:Moses Scott",
    "ORG:Moses Executive Studio",
    "TITLE:Private Grooming — Brickell, Miami",
    "TEL;TYPE=CELL,VOICE:+17604053901",
    "EMAIL;TYPE=WORK:info@mosesexecutivestudio.com",
    "URL:https://www.mosesexecutivestudio.com",
    "ADR;TYPE=WORK:;;1170 SW 2nd Ave;Miami;FL;33130;USA",
    "NOTE:Moses Executive Studio — private grooming in Brickell, Miami. By appointment.",
    "END:VCARD"
  ].join("\r\n");
  document.getElementById("saveContact").addEventListener("click", function(){
    try{
      var blob = new Blob([vcard], {type:"text/vcard;charset=utf-8"});
      var url = URL.createObjectURL(blob);
      var a = document.createElement("a");
      a.href = url; a.download = "Moses-Scott.vcf";
      document.body.appendChild(a); a.click();
      setTimeout(function(){ URL.revokeObjectURL(url); a.remove(); }, 1500);
    }catch(e){
      window.location.href = "data:text/vcard;charset=utf-8," + encodeURIComponent(vcard);
    }
  });
})();
</script>
</body>
</html>
